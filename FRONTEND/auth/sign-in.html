<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OneLink — Sign In</title>

  <!-- ── SHARED STYLES ── -->
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/reset.css" />
  <link rel="stylesheet" href="../shared/components.css" />
  <link rel="stylesheet" href="../shared/utilities.css" />
  <link rel="stylesheet" href="../shared/responsive.css" />

  <!-- ── PAGE-SPECIFIC STYLES ── -->
  <style>
    /* ────────────────────────────────────
       AUTH PAGE LAYOUT
       ──────────────────────────────────── */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Background decoration */
    .bg-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .bg-glow::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      top: -160px;
      left: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(200,240,77,0.10) 0%, transparent 70%);
      animation: pulse 6s ease-in-out infinite alternate;
    }

    .bg-glow::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      bottom: 60px;
      right: 80px;
      background: radial-gradient(circle, rgba(200,240,77,0.05) 0%, transparent 70%);
      animation: pulse 8s ease-in-out infinite alternate-reverse;
    }

    /* ────────────────────────────────────
       CARD
       ──────────────────────────────────── */
    .card {
      position: relative;
      z-index: 1;
      width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 48px 40px 40px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
      animation: rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(28px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ────────────────────────────────────
       HEADLINE
       ──────────────────────────────────── */
    .headline {
      margin-bottom: 36px;
    }

    .wordmark {
      font-family: var(--font-serif);
      font-size: 42px;
      line-height: 1;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .wordmark em {
      font-style: italic;
      color: var(--accent);
    }

    .tagline {
      font-size: 14px;
      color: var(--muted);
      font-weight: 300;
    }

    /* ────────────────────────────────────
       AUTH BUTTONS
       ──────────────────────────────────── */
    .auth-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      padding: 14px 20px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.035);
      color: var(--text);
      font-family: var(--font-family);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s, transform 0.12s, box-shadow 0.18s;
      text-decoration: none;
      margin-bottom: 10px;
      position: relative;
      overflow: hidden;
    }

    .auth-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.04), transparent);
      opacity: 0;
      transition: opacity 0.18s;
    }

    .auth-btn:hover {
      background: rgba(255,255,255,0.07);
      border-color: rgba(255,255,255,0.14);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }

    .auth-btn:hover::after {
      opacity: 1;
    }

    .auth-btn:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .auth-btn.github {
      animation: rise 0.55s 0.10s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .auth-btn.google {
      animation: rise 0.55s 0.20s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .auth-btn svg {
      flex-shrink: 0;
    }

    /* ────────────────────────────────────
       FOOTER NOTE
       ──────────────────────────────────── */
    .note {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
    }

    .note a {
      color: rgba(200,240,77,0.75);
      text-decoration: none;
      transition: color 0.15s;
    }

    .note a:hover {
      color: var(--accent);
    }

    /* ────────────────────────────────────
       LOADING / ERROR STATE
       ──────────────────────────────────── */
    .callback-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
    }

    .callback-screen .cb-title {
      font-size: 16px;
      font-weight: 500;
    }

    .callback-screen .cb-sub {
      font-size: 13px;
      color: var(--muted);
    }

    .error-icon {
      font-size: 32px;
    }

    .error-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--red);
    }

    .error-sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .back-link {
      display: inline-block;
      margin-top: 8px;
      padding: 9px 22px;
      border-radius: var(--radius-pill);
      background: rgba(200,240,77,0.10);
      border: 1px solid rgba(200,240,77,0.22);
      color: var(--accent);
      font-size: 13px;
      text-decoration: none;
      transition: background 0.15s;
    }

    .back-link:hover {
      background: rgba(200,240,77,0.18);
    }

    /* Show/hide states */
    body.loading .card > :not(.callback-screen) {
      display: none;
    }

    body.loading .callback-screen {
      display: flex;
    }

    body.error .card > :not(.callback-screen) {
      display: none;
    }

    body.error .callback-screen {
      display: flex;
    }

    /* Responsive */
    @media (max-width: 460px) {
      .card {
        width: calc(100vw - 32px);
        padding: 36px 24px 30px;
      }

      .wordmark {
        font-size: 34px;
      }
    }
  </style>
</head>
<body>
  <!-- Background decoration -->
  <div class="bg-glow"></div>

  <!-- Main card -->
  <div class="card" id="card">
    <!-- Login view -->
    <div id="loginView">
      <div class="headline">
        <div class="badge mb-md">
          <span class="badge-dot"></span>
          Beta · Free to use
        </div>
        <h1 class="wordmark">One<em>Link</em></h1>
        <p class="tagline">Your portfolio, built straight from your code.</p>
      </div>

      <div class="divider">continue with</div>

      <button class="auth-btn github" onclick="handleLogin('github')">
        <!-- GitHub icon -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.868-.013-1.703-2.782.604-3.369-1.342-3.369-1.342-.454-1.155-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
        </svg>
        Continue with GitHub
      </button>

      <button class="auth-btn google" onclick="handleLogin('google')">
        <!-- Google icon -->
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>

      <p class="note">
        By signing in you agree to our
        <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.<br/>
        We only read your public profile to build your portfolio.
      </p>
    </div>

    <!-- Callback / Loading view -->
    <div class="callback-screen" id="callbackScreen">
      <!-- Injected by script -->
    </div>
  </div>

  <!-- ── SCRIPTS ── -->
  <script src="../shared/runtime-config.js"></script>
  <script src="../shared/utils.js"></script>

  <script>
    // Handle OAuth login
    function handleLogin(provider) {
      if (provider === 'github') {
        window.location.href = `${API_URL}/auth/login`;
      } else if (provider === 'google') {
        UI.showToast('Google auth is not configured yet');
      }
    }

    // Show loading state
    function showLoading() {
      document.body.classList.add('loading');
      document.getElementById('callbackScreen').innerHTML = `
        <div class="spinner"></div>
        <span class="cb-title">Signing you in…</span>
        <span class="cb-sub">Connecting your account</span>
      `;
    }

    // Show error state
    function showError(msg) {
      document.body.classList.remove('loading');
      document.body.classList.add('error');
      document.getElementById('callbackScreen').innerHTML = `
        <div class="error-icon">⚠️</div>
        <div class="error-title">Authentication failed</div>
        <div class="error-sub">${msg}</div>
        <p style="font-size: 12px; color: #999; margin-top: 15px;">
          Debug info: ${msg}
        </p>
        <a href="./sign-in.html" class="back-link">← Back to Login</a>
      `;
      console.error('[AUTH ERROR]', msg);
    }

    // Handle OAuth callback
    async function handleCallback() {
      const token = URL.getParam('token');
      const userId = URL.getParam('user_id');
      const username = URL.getParam('username');
      const error = URL.getParam('error');

      console.log('[AUTH] Callback received:', { token: token ? 'present' : 'missing', userId, username, error });

      // Handle OAuth error from backend
      if (error) {
        showError(decodeURIComponent(error));
        return;
      }

      // Not a callback, just a regular sign-in page load
      if (!token) {
        console.log('[AUTH] No token in URL, showing regular login page');
        return;
      }

      showLoading();

      try {
        console.log('[AUTH] Setting token in localStorage...');
        Auth.setToken(token);
        
        // Seed minimal user data immediately, then hydrate from backend profile.
        const minimalUser = {
          id: parseInt(userId || '0'),
          github_username: username || 'user',
          portfolio_username: username || 'user',
        };
        
        console.log('[AUTH] Setting minimal user data:', minimalUser);
        Auth.setUser(minimalUser);

        try {
          console.log('[AUTH] Fetching full profile from /users/me...');
          const profile = await API.get('/users/me');
          if (profile) {
            console.log('[AUTH] Profile fetched successfully:', profile.github_username);
            Auth.setUser(profile);
          } else {
            console.warn('[AUTH] Profile API returned null');
          }
        } catch (profileErr) {
          console.warn('[AUTH] Failed to hydrate user profile after login:', profileErr.message);
          // Continue anyway, we have the token
        }

        console.log('[AUTH] Redirecting to dashboard...');
        // Redirect after short delay so spinner is visible
        setTimeout(() => {
          window.location.href = '../pages/dashboard.html';
        }, 800);
      } catch (err) {
        showError(err instanceof Error ? err.message : 'Something went wrong');
      }
    }

    // Handle error param from backend
    window.addEventListener('load', async () => {
      console.log('[AUTH] Window load event fired');
      await handleCallback();
      
      const errorParam = URL.getParam('error');
      if (errorParam) {
        console.error('[AUTH] Error parameter found:', errorParam);
        showError(decodeURIComponent(errorParam));
      }
    });
  </script>
</body>
</html>
