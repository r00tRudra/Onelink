<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OneLink — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0c0c0e;
      --surface:  #131316;
      --border:   rgba(255,255,255,0.07);
      --text:     #f0ede8;
      --muted:    #7a7880;
      --accent:   #c8f04d;
      --gh:       #f0ede8;
      --gg:       #f0ede8;
      --radius:   14px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── background decoration ── */
    .bg-glow {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
    }
    .bg-glow::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      top: -160px; left: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(200,240,77,0.10) 0%, transparent 70%);
      animation: pulse 6s ease-in-out infinite alternate;
    }
    .bg-glow::after {
      content: '';
      position: absolute;
      width: 300px; height: 300px;
      bottom: 60px; right: 80px;
      background: radial-gradient(circle, rgba(200,240,77,0.05) 0%, transparent 70%);
      animation: pulse 8s ease-in-out infinite alternate-reverse;
    }
    @keyframes pulse { from { opacity:.6; } to { opacity:1; } }

    /* ── card ── */
    .card {
      position: relative; z-index: 1;
      width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 48px 40px 40px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
      animation: rise .55s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes rise {
      from { opacity:0; transform:translateY(28px) scale(.97); }
      to   { opacity:1; transform:translateY(0)    scale(1);   }
    }

    /* ── badge ── */
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(200,240,77,0.10);
      border: 1px solid rgba(200,240,77,0.22);
      border-radius: 99px;
      padding: 4px 12px;
      font-size: 11px; font-weight: 500; letter-spacing: .04em;
      color: var(--accent);
      margin-bottom: 24px;
    }
    .badge-dot { width:6px; height:6px; border-radius:50%; background:var(--accent); animation: blink 1.8s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── headline ── */
    .wordmark {
      font-family: 'Instrument Serif', serif;
      font-size: 42px; line-height: 1;
      letter-spacing: -.02em;
      margin-bottom: 8px;
    }
    .wordmark em { font-style: italic; color: var(--accent); }
    .tagline { font-size: 14px; color: var(--muted); font-weight: 300; margin-bottom: 36px; }

    /* ── divider ── */
    .divider {
      display: flex; align-items: center; gap: 12px;
      color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
      margin-bottom: 14px;
    }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--border); }

    /* ── auth buttons ── */
    .auth-btn {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 11px;
      padding: 14px 20px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.035);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px; font-weight: 500;
      cursor: pointer;
      transition: background .18s, border-color .18s, transform .12s, box-shadow .18s;
      text-decoration: none;
      margin-bottom: 10px;
      position: relative; overflow: hidden;
    }
    .auth-btn::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.04), transparent);
      opacity: 0; transition: opacity .18s;
    }
    .auth-btn:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.14); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
    .auth-btn:hover::after { opacity:1; }
    .auth-btn:active { transform: translateY(0); box-shadow: none; }

    .auth-btn.github { animation: rise .55s .10s cubic-bezier(.22,1,.36,1) both; }
    .auth-btn.google { animation: rise .55s .20s cubic-bezier(.22,1,.36,1) both; }

    .auth-btn svg { flex-shrink: 0; }

    /* ── footer note ── */
    .note {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      font-size: 12px; color: var(--muted); text-align: center; line-height: 1.7;
    }
    .note a { color: rgba(200,240,77,0.75); text-decoration: none; }
    .note a:hover { color: var(--accent); }

    /* ── callback / loading state (hidden by default) ── */
    .callback-screen {
      display: none;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; text-align: center;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 2.5px solid rgba(200,240,77,0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .callback-screen .cb-title { font-size: 16px; font-weight: 500; }
    .callback-screen .cb-sub   { font-size: 13px; color: var(--muted); }

    .error-icon { font-size: 32px; }
    .error-title { font-size: 18px; font-weight: 600; color: #f87171; }
    .error-sub   { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .back-link {
      display: inline-block; margin-top: 8px;
      padding: 9px 22px; border-radius: 99px;
      background: rgba(200,240,77,0.10); border: 1px solid rgba(200,240,77,0.22);
      color: var(--accent); font-size: 13px; text-decoration: none;
      transition: background .15s;
    }
    .back-link:hover { background: rgba(200,240,77,0.18); }

    /* show/hide states */
    body.loading .card > :not(.callback-screen) { display: none; }
    body.loading .callback-screen { display: flex; }
    body.error   .card > :not(.callback-screen) { display: none; }
    body.error   .callback-screen { display: flex; }

    @media (max-width: 460px) {
      .card { width: calc(100vw - 32px); padding: 36px 24px 30px; }
      .wordmark { font-size: 34px; }
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <div class="card" id="card">

    <!-- ── Login View ── -->
    <div class="badge"><span class="badge-dot"></span> Beta · Free to use</div>

    <h1 class="wordmark">One<em>Link</em></h1>
    <p class="tagline">Your portfolio, built straight from your code.</p>

    <div class="divider">continue with</div>

    <button class="auth-btn github" onclick="handleLogin('github')">
      <!-- GitHub icon -->
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.868-.013-1.703-2.782.604-3.369-1.342-3.369-1.342-.454-1.155-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
      </svg>
      Continue with GitHub
    </button>

    <button class="auth-btn google" onclick="handleLogin('google')">
      <!-- Google icon -->
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>

    <p class="note">
      By signing in you agree to our
      <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.<br/>
      We only read your public profile to build your portfolio.
    </p>

    <!-- ── Callback / Loading View ── -->
    <div class="callback-screen" id="callbackScreen">
      <!-- content injected by JS -->
    </div>

  </div>

  <script>
    const API_URL = 'http://localhost:8000';

    function handleLogin(provider) {
      if (provider === 'github') {
        window.location.href = `${API_URL}/auth/login`;
      } else if (provider === 'google') {
        alert('Google auth is not configured on this backend yet.');
      }
    }

    /* ─── Callback handling ─── */
    function getParam(key) {
      return new URLSearchParams(window.location.search).get(key);
    }

    function showLoading() {
      document.body.classList.add('loading');
      document.getElementById('callbackScreen').innerHTML = `
        <div class="spinner"></div>
        <span class="cb-title">Signing you in…</span>
        <span class="cb-sub">Connecting your account</span>
      `;
    }

    function showError(msg) {
      document.body.classList.remove('loading');
      document.body.classList.add('error');
      document.getElementById('callbackScreen').innerHTML = `
        <div class="error-icon">⚠️</div>
        <div class="error-title">Authentication failed</div>
        <div class="error-sub">${msg}</div>
        <a href="./login.html" class="back-link">← Back to Login</a>
      `;
    }

    function handleCallback() {
      const token    = getParam('token');
      const userId   = getParam('user_id');
      const username = getParam('username');

      if (!token) return; // not a callback page load

      showLoading();

      try {
        localStorage.setItem('access_token', token);
        localStorage.setItem('auth_user', JSON.stringify({
          id: parseInt(userId || '0'),
          github_username: username || '',
          portfolio_username: username || '',
        }));

        // Redirect after short delay so spinner is visible
        setTimeout(() => { window.location.href = './landing_after_login.html'; }, 800);
      } catch (err) {
        showError(err instanceof Error ? err.message : 'Something went wrong.');
      }
    }

    handleCallback();

    /* ─── Error param from backend ─── */
    const errorParam = getParam('error');
    if (errorParam) showError(decodeURIComponent(errorParam));
  </script>
</body>
</html>
