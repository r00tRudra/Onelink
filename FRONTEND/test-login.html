<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Login - OneLink</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0a0e27;
      color: #e0e0e0;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: #1a1f3a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 40px;
      max-width: 400px;
      text-align: center;
    }
    h1 {
      margin-top: 0;
      font-size: 28px;
    }
    p {
      color: #999;
      margin: 15px 0;
    }
    .token-box {
      background: #0a0e27;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 10px;
      margin: 20px 0;
      font-size: 11px;
      word-break: break-all;
      max-height: 100px;
      overflow-y: auto;
      color: #4fc3f7;
      font-family: monospace;
    }
    button {
      background: #c8f04d;
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.8;
    }
    .status {
      margin-top: 20px;
      padding: 10px;
      border-radius: 4px;
      font-size: 14px;
    }
    .status.success {
      background: #1b5e20;
      color: #4caf50;
    }
    .status.error {
      background: #b71c1c;
      color: #ff6b6b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>OneLink Test Login</h1>
    <p>This page injects a valid JWT token for testing purposes.</p>
    
    <div class="token-box" id="tokenBox">
      Token will appear here...
    </div>
    
    <p style="font-size: 12px; color: #666;">
      This token is for user ID 1 (r00tRudra) and will expire in 7 days.
    </p>
    
    <button onclick="testLogin()">Login & Test Dashboard</button>
    
    <div id="status"></div>
  </div>

  <script>
    const TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwiZXhwIjoxNzc4NjEzMjI4fQ.kflb1EsSaNjDdL_d82XnwBF-LI9os3ho2LDkCEeqync";
    
    // Display token on load
    document.getElementById('tokenBox').textContent = TOKEN;
    
    async function testLogin() {
      const statusEl = document.getElementById('status');
      
      try {
        // Set token in localStorage
        localStorage.setItem('access_token', TOKEN);
        
        // Set minimal user data
        const userData = {
          id: 1,
          github_username: 'r00tRudra',
          portfolio_username: 'r00tRudra'
        };
        localStorage.setItem('auth_user', JSON.stringify(userData));
        
        statusEl.className = 'status success';
        statusEl.textContent = '✓ Token set! Redirecting to dashboard...';
        
        // Redirect to dashboard after 1 second
        setTimeout(() => {
          window.location.href = './pages/dashboard.html';
        }, 1000);
        
      } catch (error) {
        statusEl.className = 'status error';
        statusEl.textContent = '✗ Error: ' + error.message;
      }
    }
  </script>
</body>
</html>
